  <script>
    /* One-time reset for browsers still running an old service-worker cache. */
    (function () {
      try {
        var stamp = 'v1.6.0';
        if (!('serviceWorker' in navigator) || localStorage.getItem('cf.cacheReset') === stamp) return;
        Promise.all([navigator.serviceWorker.getRegistrations(), caches.keys()])
          .then(function (res) {
            var regs = res[0] || [];
            var keys = (res[1] || []).filter(function (k) { return k.indexOf('coloursflux-') === 0; });
            if (!regs.length && !keys.length) return;
            localStorage.setItem('cf.cacheReset', stamp);
            return Promise.all(
              regs.map(function (r) { return r.unregister(); }).concat(
                keys.map(function (k) { return caches.delete(k); })
              )
            ).then(function () { location.reload(); });
          })
          .catch(function () {});
      } catch (e) {}
    })();
  </script>
