<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin — ColoursFlux</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#080B1A" />
  <meta name="color-scheme" content="dark" />
  <link rel="preload" href="../assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" href="../assets/icons/favicon.png" sizes="64x64" type="image/png" />
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <script type="module" src="../assets/js/admin/app.js"></script>
</head>
<body class="admin-body">
  <a class="skip-link" href="#admin-view">Skip to dashboard</a>

  <div id="admin-root">
    <main id="admin-view" class="login-wrap" tabindex="-1">
      <div class="login-card" aria-busy="true">
        <p class="eyebrow">ColoursFlux</p>
        <h1>Loading dashboard…</h1>
        <p class="muted">Checking for an existing organiser session.</p>
      </div>
    </main>
  </div>

  <noscript>
    <div class="login-wrap">
      <div class="login-card">
        <h1>JavaScript is required</h1>
        <p class="muted">The admin dashboard needs JavaScript. The public festival site still works without it.</p>
      </div>
    </div>
  </noscript>
</body>
</html>
